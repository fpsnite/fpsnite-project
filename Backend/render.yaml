# Render blueprint for the FPS NITE backend (free tier).
# Deploy: push the Backend/ folder to GitHub, then in Render use
# "Blueprint" -> your repo. The service below is picked up automatically.
# Alternatively create a plain Web Service manually:
#   - Root directory: Backend
#   - Build command:  pip install -r requirements.txt
#   - Start command:  sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
services:
  - type: web
    name: fpsnite-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./fpsnite.db
      - key: CORS_ORIGINS
        value: "*"